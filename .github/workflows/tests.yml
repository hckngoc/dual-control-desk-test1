name: Policy and Next.js checks
on:
  push:
    branches: [main, feat/challenge2-hardening-thinh]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm test
      - run: npm run check
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm run typecheck
        working-directory: app
